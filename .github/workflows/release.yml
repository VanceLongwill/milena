name: Release on tag (binaries + Docker)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: milena
  DOCKER_IMAGE: vancelongwill/milena

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14          # Apple Silicon for arm64 builds
            target: aarch64-apple-darwin
          - os: macos-13          # Intel runner for x86_64 builds
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libssl-dev libsasl2-dev librdkafka-dev \
            libzstd-dev zlib1g-dev
          # Workaround CMake 4.x policy removal for vendored builds
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          # These help both vendored and non-vendored paths
          brew install pkg-config openssl@3 zstd cyrus-sasl librdkafka || true

          # OpenSSL hints (harmless if unused)
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"

          # Workaround CMake 4.x policy removal for vendored builds
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (HashiCorp-style names)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.3 or 1.2.3
          VERSION="${TAG#v}"                # strip leading v if present
          TARGET="${{ matrix.target }}"

          case "${TARGET}" in
            x86_64-unknown-linux-gnu) OS="linux";  ARCH="amd64" ;;
            aarch64-apple-darwin)     OS="darwin"; ARCH="arm64" ;;
            x86_64-apple-darwin)      OS="darwin"; ARCH="amd64" ;;
            *) echo "Unknown target ${TARGET}"; exit 1 ;;
          esac

          OUTDIR="dist/${TAG}"
          mkdir -p "${OUTDIR}"

          BIN_PATH="target/${TARGET}/release/${BIN_NAME}"
          test -f "${BIN_PATH}"

          PKG_NAME="${BIN_NAME}_${VERSION}_${OS}_${ARCH}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "${OUTDIR}/${PKG_NAME}" "${BIN_NAME}"

          # Per-asset checksum (handy for debugging). The combined file
          # is generated in the release job.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${OUTDIR}" && sha256sum "${PKG_NAME}" > "${PKG_NAME}.sha256")
          else
            (cd "${OUTDIR}" && shasum -a 256 "${PKG_NAME}" > "${PKG_NAME}.sha256")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ github.ref_name }}/*

  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
