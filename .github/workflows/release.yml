name: Release on tag (binaries + Docker)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: milena
  DOCKER_IMAGE: vancelongwill/milena

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14       # Apple Silicon host for arm64
            target: aarch64-apple-darwin
          - os: macos-13       # Intel host for x86_64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libssl-dev libsasl2-dev librdkafka-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config cyrus-sasl librdkafka openssl@3 || true
          # Ensure pkg-config can find libsasl2 provided by cyrus-sasl
          echo "PKG_CONFIG_PATH=$(brew --prefix cyrus-sasl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
          # OpenSSL include/lib hints (often not required, but harmless)
          echo "LDFLAGS=-L$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix openssl@3)/include" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (HashiCorp-style names)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"              # e.g. v1.2.3 or 1.2.3
          VERSION="${TAG#v}"                    # strip leading v if present
          TARGET="${{ matrix.target }}"

          case "${TARGET}" in
            x86_64-unknown-linux-gnu) OS="linux";  ARCH="amd64" ;;
            aarch64-apple-darwin)     OS="darwin"; ARCH="arm64" ;;
            x86_64-apple-darwin)      OS="darwin"; ARCH="amd64" ;;
            *) echo "Unknown target ${TARGET}"; exit 1 ;;
          esac

          OUTDIR="dist/${TAG}"
          mkdir -p "${OUTDIR}"

          BIN_PATH="target/${TARGET}/release/${BIN_NAME}"
          test -f "${BIN_PATH}"

          PKG_NAME="${BIN_NAME}_${VERSION}_${OS}_${ARCH}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "${OUTDIR}/${PKG_NAME}" "${BIN_NAME}"

          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${OUTDIR}" && sha256sum "${PKG_NAME}" > "${PKG_NAME}.sha256")
          else
            (cd "${OUTDIR}" && shasum -a 256 "${PKG_NAME}" > "${PKG_NAME}.sha256")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ github.ref_name }}/*

  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCTOR_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Build combined SHA256SUMS (HashiCorp-style)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          cd dist
          TARBALLS=$(find . -type f -name "*.tar.gz" | sort)
          : > "milena_${VERSION}_SHA256SUMS"

          if command -v sha256sum >/dev/null 2>&1; then
            for f in $TARBALLS; do
              sha256sum "$f" | awk '{print $1"  "substr($0,index($0,$2))}' >> "milena_${VERSION}_SHA256SUMS"
            done
          else
            for f in $TARBALLS; do
              shasum -a 256 "$f" | awk '{print $1"  "substr($0,index($0,$2))}' >> "milena_${VERSION}_SHA256SUMS"
            done
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/**/*.tar.gz
            dist/milena_${{ github.ref_name#v }}_SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
