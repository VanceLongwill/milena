name: Release

on:
  push:
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary with vendored dependencies
        run: |
          cross build --release --target ${{ matrix.target }} --features "rdkafka/cmake-build,rdkafka/ssl-vendored,rdkafka/gssapi-vendored,rdkafka/libz-static"

      - name: Prepare binary
        run: |
          cd target/${{ matrix.target }}/release
          strip milena
          tar czf milena_${{ needs.create-release.outputs.version }}_linux_${{ matrix.arch }}.tar.gz milena
          mv milena_${{ needs.create-release.outputs.version }}_linux_${{ matrix.arch }}.tar.gz $GITHUB_WORKSPACE/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: milena_${{ needs.create-release.outputs.version }}_linux_${{ matrix.arch }}.tar.gz

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: amd64
            os: macos-13
          - arch: arm64
            os: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          brew install cmake

      - name: Build binary
        run: |
          cargo build --release --features "rdkafka/cmake-build,rdkafka/ssl-vendored,rdkafka/gssapi-vendored,rdkafka/libz-static"

      - name: Prepare binary
        run: |
          cd target/release
          strip milena
          tar czf milena_${{ needs.create-release.outputs.version }}_darwin_${{ matrix.arch }}.tar.gz milena
          mv milena_${{ needs.create-release.outputs.version }}_darwin_${{ matrix.arch }}.tar.gz $GITHUB_WORKSPACE/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: milena_${{ needs.create-release.outputs.version }}_darwin_${{ matrix.arch }}.tar.gz

  generate-checksums:
    name: Generate Checksums
    needs: [create-release, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ needs.create-release.outputs.version }}
          fileName: "*.tar.gz"

      - name: Generate SHA256SUMS
        run: |
          sha256sum *.tar.gz > milena_${{ needs.create-release.outputs.version }}_SHA256SUMS

      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@v1
        with:
          files: milena_${{ needs.create-release.outputs.version }}_SHA256SUMS

  build-and-push-docker:
    name: Build and Push Docker Image
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            vancelongwill/milena
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
