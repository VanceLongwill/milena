name: Release

on:
  push:
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Create Cross.toml
        run: |
          cat > Cross.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          pre-build = [
              "dpkg --add-architecture amd64",
              "apt-get update",
              "apt-get install -y libsasl2-dev:amd64 libssl-dev:amd64 pkg-config"
          ]

          [target.aarch64-unknown-linux-gnu]
          pre-build = [
              "dpkg --add-architecture arm64",
              "apt-get update",
              "apt-get install -y libsasl2-dev:arm64 libssl-dev:arm64 pkg-config"
          ]
          EOF

      - name: Build binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          cd target/${{ matrix.target }}/release
          strip milena || true
          chmod +x milena
          tar czf milena_${{ needs.create-release.outputs.version }}_linux_${{ matrix.arch }}.tar.gz milena
          mv milena_${{ needs.create-release.outputs.version }}_linux_${{ matrix.arch }}.tar.gz $GITHUB_WORKSPACE/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: milena_${{ needs.create-release.outputs.version }}_linux_${{ matrix.arch }}.tar.gz

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: macos-13
          - arch: arm64
            os: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          brew install cmake openssl@3 zstd cyrus-sasl
          # Force link openssl@3
          brew link openssl@3 --force || true
          
      - name: Setup environment
        run: |
          # Set up paths for both Intel and Apple Silicon Macs
          BREW_PREFIX=$(brew --prefix)
          OPENSSL_PATH="$BREW_PREFIX/opt/openssl@3"
          
          echo "$BREW_PREFIX/bin" >> $GITHUB_PATH
          echo "CMAKE=$BREW_PREFIX/bin/cmake" >> $GITHUB_ENV
          echo "OPENSSL_DIR=$OPENSSL_PATH" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PATH/lib" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PATH/include" >> $GITHUB_ENV
          echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PATH/lib/pkgconfig:$BREW_PREFIX/lib/pkgconfig" >> $GITHUB_ENV
          
          # Verify the paths exist
          echo "Homebrew prefix: $BREW_PREFIX"
          echo "OpenSSL path: $OPENSSL_PATH"
          ls -la "$OPENSSL_PATH/" || echo "OpenSSL directory not found"
          ls -la "$OPENSSL_PATH/include" || echo "OpenSSL include directory not found"
          
      - name: Verify CMake version
        run: |
          which cmake
          cmake --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        run: |
          echo "OPENSSL_DIR is: $OPENSSL_DIR"
          echo "PATH is: $PATH"
          cargo build --release

      - name: Prepare binary
        run: |
          cd target/release
          strip milena || true
          chmod +x milena
          tar czf milena_${{ needs.create-release.outputs.version }}_darwin_${{ matrix.arch }}.tar.gz milena
          mv milena_${{ needs.create-release.outputs.version }}_darwin_${{ matrix.arch }}.tar.gz $GITHUB_WORKSPACE/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: milena_${{ needs.create-release.outputs.version }}_darwin_${{ matrix.arch }}.tar.gz

  generate-checksums:
    name: Generate Checksums
    needs: [create-release, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ needs.create-release.outputs.version }}
          fileName: "*.tar.gz"

      - name: Generate SHA256SUMS
        run: |
          sha256sum *.tar.gz > milena_${{ needs.create-release.outputs.version }}_SHA256SUMS

      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@v1
        with:
          files: milena_${{ needs.create-release.outputs.version }}_SHA256SUMS

  build-and-push-docker:
    name: Build and Push Docker Image
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            vancelongwill/milena
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
